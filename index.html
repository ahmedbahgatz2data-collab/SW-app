<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستكشف البلوتوث - Web Bluetooth</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #f4f4f9; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; border: none; background: #007bff; color: white; border-radius: 8px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; }
        #services { text-align: left; background: #fff; padding: 15px; border-radius: 8px; margin-top: 15px; max-height: 300px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>

    <h2>مستكشف البلوتوث للساعة الذكية ⌚</h2>
    <p>اضغط على الزر للبحث عن الساعات المتاحة والاتصال بها</p>
    
    <button onclick="scanAndConnect()">البحث عن الساعة والاتصال</button>

    <div id="status">الحالة: غير متصل</div>
    <div id="services"></div>

    <script>
        async function scanAndConnect() {
            const statusDiv = document.getElementById('status');
            const servicesDiv = document.getElementById('services');
            servicesDiv.innerHTML = '';

            try {
                statusDiv.innerText = 'جاري البحث عن أجهزة البلوتوث...';

                // 1. طلب البحث عن أجهزة BLE (تسمح بالوصول لجميع الأجهزة)
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [] // يمكن إضافة UUIDs مخصصة هنا لاحقاً
                });

                statusDiv.innerText = `جاري الاتصال بـ: ${device.name || 'جهاز بدون اسم'}...`;

                // 2. الاتصال بالسيرفر الخاص بالجهاز (GATT Server)
                const server = await device.gatt.connect();
                statusDiv.innerText = `تم الاتصال بنجاح بـ: ${device.name || 'الجهاز'}`;

                // 3. استكشاف الخدمات (Services) المتاحة في الساعة
                statusDiv.innerText += ' | جاري قراءة الخدمات...';
                const services = await server.getPrimaryServices();

                let output = '<b>الخدمات المكتشفة (Services UUIDs):</b><br>';
                services.forEach(service => {
                    output += `• ${service.uuid}<br>`;
                });
                servicesDiv.innerHTML = output;

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `خطأ: ${error.message}`;
            }
        }
    </script>
</body>
</html>

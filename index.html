<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الساعة + قارئ QR</title>
    <!-- استدعاء مكتبة QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; text-align: center; }
        .btn { padding: 12px 24px; font-size: 15px; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #10b981; }
        #status { margin-top: 15px; font-size: 14px; color: #38bdf8; }
        #reader { width: 100%; max-width: 350px; margin: 15px auto; border-radius: 12px; overflow: hidden; display: none; }
        #qr-result { margin-top: 10px; background: #1e293b; padding: 10px; border-radius: 8px; font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>

    <h2>تطبيق الساعة الذكية ⌚</h2>
    
    <!-- أزرار التحكم -->
    <button class="btn btn-blue" onclick="scanBLE()">البحث عن الساعة (BLE)</button>
    <button class="btn btn-green" onclick="toggleQRScanner()">مسح QR Code 📷</button>

    <!-- منطقة الكاميرا لقراءة الـ QR -->
    <div id="reader"></div>
    <div id="qr-result">نتيجة الـ QR ستظهر هنا...</div>

    <div id="status">الحالة: جاهز</div>

    <script>
        let html5QrcodeScanner = null;

        // 1. تشغيل / إيقاف قارئ الـ QR Code
        function toggleQRScanner() {
            const readerDiv = document.getElementById('reader');
            const resultDiv = document.getElementById('qr-result');

            if (readerDiv.style.display === 'block') {
                // إيقاف الكاميرا
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        readerDiv.style.display = 'none';
                    });
                }
            } else {
                // فتح الكاميرا والبدء بالمسح
                readerDiv.style.display = 'block';
                html5QrcodeScanner = new Html5Qrcode("reader");

                html5QrcodeScanner.start(
                    { facingMode: "environment" }, // استخدام الكاميرا الخلفية
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText, decodedResult) => {
                        // عند قراءة الـ QR بنجاح
                        resultDiv.innerHTML = `<b>تم القراءة:</b><br>${decodedText}`;
                        // إيقاف الكاميرا تلقائياً بعد القراءة
                        html5QrcodeScanner.stop().then(() => {
                            readerDiv.style.display = 'none';
                        });
                    },
                    (errorMessage) => {
                        // جاري المسح...
                    }
                ).catch(err => {
                    resultDiv.innerText = "خطأ في فتح الكاميرا: " + err;
                });
            }
        }

        // 2. كود البلوتوث الخاص بنا
        async function scanBLE() {
            const statusDiv = document.getElementById('status');
            try {
                statusDiv.innerText = 'جاري البحث عن الساعة...';
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });
                statusDiv.innerText = `تم اختيار: ${device.name || 'جهاز بدون اسم'}`;
                await device.gatt.connect();
                statusDiv.innerText = `متصل بـ: ${device.name || 'الساعة'}`;
            } catch (e) {
                statusDiv.innerText = `خطأ BLE: ${e.message}`;
            }
        }
    </script>
</body>
</html>

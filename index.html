<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oraimo Watch - BLE Explorer</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; max-width: 450px; margin-left: auto; margin-right: auto; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 16px; }
        .btn { padding: 12px 20px; font-size: 15px; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; width: 90%; }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #10b981; }
        #status { margin-top: 15px; font-size: 14px; color: #38bdf8; font-weight: 500; }
        #reader { width: 100%; max-width: 350px; margin: 15px auto; border-radius: 12px; overflow: hidden; display: none; }
        #qr-result { margin-top: 10px; background: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; word-break: break-all; font-size: 13px; color: #a5f3fc; }
        .console-log { text-align: left; background: #020617; padding: 15px; border-radius: 10px; margin-top: 15px; font-family: monospace; border: 1px solid #1e293b; color: #4ade80; font-size: 12px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Oraimo Watch Explorer ⌚</h2>

    <div class="card">
        <label><b>موديل الساعة أو بادئة الاسم:</b></label><br><br>
        <input type="text" id="devicePrefix" value="oraimo" placeholder="مثال: oraimo">
        
        <button class="btn btn-blue" onclick="connectAndScan()">اتصال وفحص القنوات الشامل 🔵</button>
        <button class="btn btn-green" onclick="toggleQRScanner()">مسح QR Code 📷</button>
    </div>

    <div id="reader"></div>
    <div id="qr-result">نتيجة مسح الـ QR ستظهر هنا...</div>

    <div id="status">الحالة: جاهز للاتصال</div>
    <div id="log" class="console-log">سجل القنوات والميزات سيظهر هنا...</div>

    <script>
        let html5QrcodeScanner = null;

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toggleQRScanner() {
            const readerDiv = document.getElementById('reader');
            const resultDiv = document.getElementById('qr-result');

            if (readerDiv.style.display === 'block') {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => { readerDiv.style.display = 'none'; });
                }
            } else {
                readerDiv.style.display = 'block';
                html5QrcodeScanner = new Html5Qrcode("reader");

                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        resultDiv.innerHTML = `<b>تم القراءة:</b><br>${decodedText}`;
                        const match = decodedText.match(/(OSW-[A-Za-z0-9]+|oraimo)/i);
                        if (match) { document.getElementById('devicePrefix').value = match[0]; }
                        html5QrcodeScanner.stop().then(() => { readerDiv.style.display = 'none'; });
                    },
                    (err) => {}
                ).catch(err => { resultDiv.innerText = "خطأ الكاميرا: " + err; });
            }
        }

        async function connectAndScan() {
            const statusDiv = document.getElementById('status');
            const userPrefix = document.getElementById('devicePrefix').value.trim();
            document.getElementById('log').innerHTML = '';

            // القائمة الشاملة لجميع UUIDs المحتملة لساعات Oraimo وشرائح Realtek/JL/Nordic
            const knownServices = [
                '0000180a-0000-1000-8000-00805f9b34fb', // Device Info
                '0000180f-0000-1000-8000-00805f9b34fb', // Battery Level
                '0000ffe0-0000-1000-8000-00805f9b34fb', // Custom Serial / WatchFace
                '0000ffe1-0000-1000-8000-00805f9b34fb',
                '0000fee0-0000-1000-8000-00805f9b34fb', // Health Data
                '0000fee1-0000-1000-8000-00805f9b34fb',
                '0000fc00-0000-1000-8000-00805f9b34fb',
                '00001910-0000-1000-8000-00805f9b34fb', // OTA / Protocol
                '00000001-0000-1000-8000-00805f9b34fb',
                '6e400001-b5a3-f393-e0a9-e50e24dcca9e'  // Nordic UART
            ];

            try {
                statusDiv.innerText = `جاري طلب الاتصال بالساعة...`;
                log(`البحث عن أجهزة بـ: ${userPrefix || 'الجميع'}`);

                const options = {
                    acceptAllDevices: true,
                    optionalServices: knownServices
                };

                const device = await navigator.bluetooth.requestDevice(options);

                log(`تم اختيار الجهاز: ${device.name || 'بدون اسم'}`);
                statusDiv.innerText = `جاري الاتصال...`;

                const server = await device.gatt.connect();
                log(`تم الاتصال بـ GATT Server بنجاح! 🟢`);
                statusDiv.innerText = `متصل بنجاح 🟢`;

                // الفحص المباشر للخدمات غير المحظورة
                for (const serviceUuid of knownServices) {
                    try {
                        const service = await server.getPrimaryService(serviceUuid);
                        log(`✅ تم العثور على الخدمة: <b>${serviceUuid}</b>`);

                        const characteristics = await service.getCharacteristics();
                        for (const c of characteristics) {
                            let props = [];
                            if (c.properties.read) props.push('READ');
                            if (c.properties.write) props.push('WRITE');
                            if (c.properties.writeWithoutResponse) props.push('WRITE_NO_RESP');
                            if (c.properties.notify) props.push('NOTIFY');
                            log(`  └─ Char: ${c.uuid} [${props.join(', ')}]`);
                        }
                    } catch (sErr) {
                        // خفية - الخدمات غير الموجودة تتخطاها بدون إخراج خطأ مزعج
                    }
                }

                statusDiv.innerText = `اكتمل الفحص المستهدف ✅`;

            } catch (e) {
                console.error(e);
                log(`خطأ: ${e.message}`);
                statusDiv.innerText = `خطأ: ${e.message}`;
            }
        }
    </script>
</body>
</html>
